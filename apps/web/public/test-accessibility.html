<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🧪 Accessibility Features Test</h1>
    
    <div class="test-section">
        <h2>Current Status</h2>
        <div id="status"></div>
    </div>

    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="testHighContrast()">Toggle High Contrast</button>
        <button onclick="testSimpleMode()">Toggle Simple Mode</button>
        <button onclick="testFontSize()">Increase Font Size</button>
        <button onclick="checkClasses()">Check HTML Classes</button>
        <button onclick="checkCSS()">Check CSS Loaded</button>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results"></div>
    </div>

    <script>
        function updateStatus() {
            const html = document.documentElement;
            const status = document.getElementById('status');
            
            const info = {
                'HTML Classes': html.className || 'none',
                'Font Size Attribute': html.getAttribute('data-font-size') || 'not set',
                'Computed Font Size': window.getComputedStyle(html).fontSize,
                'High Contrast': html.classList.contains('high-contrast') ? '✅ Active' : '❌ Inactive',
                'Simple Mode': html.classList.contains('simple-mode') ? '✅ Active' : '❌ Inactive',
                'Reduced Motion': html.classList.contains('reduced-motion') ? '✅ Active' : '❌ Inactive'
            };

            status.innerHTML = Object.entries(info)
                .map(([key, value]) => `<div><strong>${key}:</strong> ${value}</div>`)
                .join('');
        }

        function testHighContrast() {
            const html = document.documentElement;
            html.classList.toggle('high-contrast');
            updateStatus();
            addResult('High contrast toggled');
        }

        function testSimpleMode() {
            const html = document.documentElement;
            html.classList.toggle('simple-mode');
            updateStatus();
            addResult('Simple mode toggled');
        }

        function testFontSize() {
            const html = document.documentElement;
            const sizes = ['small', 'medium', 'large', 'xlarge'];
            const current = html.getAttribute('data-font-size') || 'medium';
            const currentIndex = sizes.indexOf(current);
            const nextIndex = (currentIndex + 1) % sizes.length;
            html.setAttribute('data-font-size', sizes[nextIndex]);
            updateStatus();
            addResult(`Font size changed to: ${sizes[nextIndex]}`);
        }

        function checkClasses() {
            const html = document.documentElement;
            const classes = html.className;
            addResult(classes ? `HTML classes: ${classes}` : 'No classes on HTML element', !classes);
        }

        function checkCSS() {
            const stylesheets = Array.from(document.styleSheets);
            const accessibilityCSS = stylesheets.find(sheet => {
                try {
                    return sheet.href && sheet.href.includes('accessibility');
                } catch (e) {
                    return false;
                }
            });

            if (accessibilityCSS) {
                addResult('✅ accessibility.css is loaded');
                try {
                    const rules = Array.from(accessibilityCSS.cssRules || []);
                    addResult(`Found ${rules.length} CSS rules`);
                } catch (e) {
                    addResult('⚠️ Cannot read CSS rules (CORS)');
                }
            } else {
                addResult('❌ accessibility.css NOT found', true);
            }
        }

        function addResult(message, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.insertBefore(div, results.firstChild);
        }

        // Initial status
        updateStatus();
        
        // Auto-check on load
        setTimeout(() => {
            checkCSS();
            checkClasses();
        }, 500);
    </script>
</body>
</html>
